<script>
  document.getElementById("add-task-btn").addEventListener("click", function(e) {

    var table = document.getElementById("task-table");
    table.style.display = table.style.display === "none" ? "block" : "none";
  });

<mat-card>
    <mat-card-header>
      <mat-card-title>Create a Task</mat-card-title>
    </mat-card-header>
    <div class="header" >
      <button mat-raised-button type="button" >Cancel</button>
  </div>
    <mat-card-content>
      <form #f="ngForm" class="mat-elevation-z8" style="width: 100%; padding: 20px;">
        <mat-form-field appearance="fill">
          <mat-label>Title</mat-label>
          
          <input  matInput placeholder="Title" name="name"  required >  
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Description</mat-label>
          
          <input  matInput placeholder="Description" name="title"  required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Status</mat-label>
          <input matInput placeholder="Status" name="email"  required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Phone</mat-label>
          <input  matInput placeholder="Phone" name="phone"  required>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>DueDate</mat-label>
          <input matInput placeholder="DueDate" name="address" >
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>CreatedAt</mat-label>
          <input matInput placeholder="CreatedAt" name="city" required> 
        </mat-form-field>
        
      </form>
  
    </mat-card-content>
    
    <mat-card-actions>
        <button  mat-raised-button  color="primary"><i class="fa fa-bookmark fa-lg" aria-hidden="true"></i></button>
        <!-- <td mat-raised-button *ngIf="!contact.id" (click)="createContact(f)" color="primary"></td>  -->
        <button  mat-raised-button  color="primary"><div class="fa-3x"></div><i class="fa fa-pencil fa-lg" aria-hidden="true"></i></button>
        <button  mat-raised-button  color="primary"><i class="fa fa-plus-square-o fa-lg" aria-hidden="true"></i></button> 
    </mat-card-actions>
   
    <div id="container"></div>
  </mat-card>
